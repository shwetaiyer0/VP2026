ssg: static

paths:
  uploads: "images"
  static: ""

# Enable commit message prompt when saving
commit_templates:
  - template_string: "{message}"
    label: "Describe your changes"

collections_config:
  pages:
    path: ""
    output: true
    filter: "strict"
    glob: "*.html"
    url: "/[slug].html"
    icon: "description"
    name: "Pages"
  classes:
    name: "Weekly Classes"
    path: "js/classData.json"
    icon: "event"
    output: false

# Configure input fields for classData.json
_inputs:
  text:
    type: text
    label: "Name of the Text"
    comment: "e.g., The Fall of the Human Intellect"
  day:
    type: select
    label: "Day of the Week"
    options:
      values:
        - "MONDAY"
        - "TUESDAY"
        - "WEDNESDAY"
        - "THURSDAY"
        - "FRIDAY"
        - "SATURDAY"
        - "SUNDAY"
  time:
    type: text
    label: "Time Duration"
    comment: "e.g., 8:15 - 9:30 am"
  area:
    type: text
    label: "Area / Neighborhood"
  lat:
    type: number
    label: "Latitude"
    step: 0.0000001
  lng:
    type: number
    label: "Longitude"
    step: 0.0000001
  location:
    type: textarea
    label: "Full Address"
  contact:
    type: text
    label: "Contact person name & phone"
    comment: "e.g., Sanyukta - 9527484959"
  youth:
    type: boolean
    label: "Is Youth Class?"
    comment: "e.g., true or false"

    